buildscript {
    repositories {
        maven {
            name = 'SpongePowered'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
    }
}

sourceSets {
    main {
        java {
            setSrcDirs(['src/main/java'])
            include 'dev/xantha/vss/**'
        }
        resources {
            setSrcDirs(['src/main/resources'])
            include 'META-INF/mods.toml'
            include 'META-INF/vss-natives/**'
            include 'META-INF/THIRD_PARTY_LICENSES.md'
            include 'pack.mcmeta'
            include 'icon.png'
            include 'vss.compat.mixins.json'
            include 'vss.strict.mixins.json'
            include 'vss.refmap.json'
            include 'assets/vss/**'
        }
    }
    test {
        java {
            setSrcDirs(['src/test/java'])
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly fg.deobf("maven.modrinth:embeddium:0.3.31+mc1.20.1")

    // 单元测试：仅用于验证与 Minecraft 运行时解耦的纯逻辑单元（如 BandwidthLimiter）。
    // 这些依赖只进入 test classpath，不影响主 mod 构建或 ForgeGradle 的 reobf 流程。
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

mixin {
    add sourceSets.main, 'vss.refmap.json'
    config 'vss.compat.mixins.json'
    config 'vss.strict.mixins.json'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    destinationDirectory = layout.projectDirectory.dir('lib')
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : 'vss.compat.mixins.json,vss.strict.mixins.json'
        ])
    }

    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 启用 JUnit 5（JUnit Platform）运行纯逻辑单元测试。
// ForgeGradle 不会把 test sourceSet 纳入 reobf / mod 打包，因此这些测试
// 不会影响最终 jar，只在 `./gradlew test` 时运行。
tasks.named('test', Test).configure {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

// Forwards the optional compatibility inputs (native library, terrain mod jars,
// live snapshot) to the test JVM. Without this the scripts under
// tools/prediction never ran, so every test gated on `vss.testNativeLibrary`,
// `vss.tectonicJar`, `vss.lithostitchedJar` or `vss.freeTerraForgedJar` was
// silently skipped - reported as "not failed" rather than as "not run".
//
// Each property is guarded by `isPresent()` inside the script, so a build that
// supplies none of them behaves exactly as before. `gpu-tests.gradle` is
// deliberately not applied: it sets `vss.gpuTests=true` unconditionally.
apply from: 'tools/prediction/compat-tests.gradle'
