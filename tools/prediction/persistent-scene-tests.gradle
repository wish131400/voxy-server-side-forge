// Isolated validation; preserves the previously delivered coverage artifacts.
gradle.projectsLoaded {
    rootProject.allprojects {
        layout.buildDirectory = layout.projectDirectory.dir('build-persistent-scene-20261015')
        afterEvaluate {
            tasks.named('jar', Jar).configure {
                destinationDirectory = layout.projectDirectory.dir('lib/persistent-scene-20261015')
            }
            sourceSets.create('persistentScene') {
                java.srcDirs = sourceSets.test.java.srcDirs + [
                    'tools/prediction/gpu-selection-retained/baseline-src',
                    'tools/prediction/far-terrain-20261014/java',
                    'tools/prediction/progressive-detail-20261014/java']
                java.include 'dev/xantha/vss/client/prediction/**'
                java.exclude '**/PredictionGpuTraversalExperimentTest.java'
                java.include 'dev/xantha/vss/testutil/**'
                java.include 'me/cortex/voxy/**'
                resources.srcDirs = sourceSets.test.resources.srcDirs + [
                    'tools/prediction/far-terrain-20261014/resources',
                    'tools/prediction/progressive-detail-20261014/resources']
                compileClasspath += sourceSets.main.output + sourceSets.test.compileClasspath
                runtimeClasspath = output + files(sourceSets.main.output, sourceSets.test.compileClasspath,
                    sourceSets.main.runtimeClasspath, configurations.testRuntimeClasspath)
            }
            def regression = { Test task, String name ->
                task.dependsOn tasks.named('persistentSceneClasses')
                task.testClassesDirs = sourceSets.persistentScene.output.classesDirs
                task.classpath = sourceSets.persistentScene.runtimeClasspath
                task.useJUnitPlatform()
                task.maxHeapSize = '4G'
                task.reports.junitXml.outputLocation = layout.buildDirectory.dir("test-results/${name}")
                task.reports.html.outputLocation = layout.buildDirectory.dir("reports/tests/${name}")
                task.systemProperty 'vss.followupResults', layout.buildDirectory.dir('results').get().asFile.absolutePath
                task.systemProperty 'vss.persistentSceneResults', layout.buildDirectory.dir('results').get().asFile.absolutePath
                task.testLogging { events 'failed', 'skipped'; showStandardStreams = true }
            }
            tasks.register('persistentSceneTest', Test) {
                regression(delegate, 'persistent-scene-cpu')
                ['GpuScene', 'SubmissionChanges', 'GpuSelectionPolicy', 'GpuSelectionInput', 'FramePlan', 'AuthoritativeCoverageView',
                 'IncrementalRender', 'PreparedPassLocal', 'ScopedResidency', 'SubmissionCoverage',
                 'MainReduction', 'TurnMain', 'OcclusionPolicy', 'MemoryLifecycle'].each {
                    include "**/Prediction${it}Test.class"
                }
            }
            tasks.register('persistentSceneGpuTest', Test) {
                regression(delegate, 'persistent-scene-gpu')
                forkEvery = 1
                systemProperty 'vss.gpuTests', 'true'
                systemProperty 'vss.indirectArenaMiB', '128'
                ['GpuScene', 'ProductionBatch', 'Compact', 'DisplayLod', 'SeamResidency', 'FeatureHandoff',
                 'AuthoritativeCoverageView', 'TurnMain', 'RefinementOcclusion', 'RenderTarget'].each {
                    include "**/Prediction${it}GpuTest.class"
                }
            }
        }
    }
}
