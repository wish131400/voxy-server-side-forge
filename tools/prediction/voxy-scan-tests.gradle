// Apply after feature-handoff-tests.gradle; keep earlier distributed JARs intact.
gradle.projectsLoaded {
    rootProject.allprojects {
        layout.buildDirectory = layout.projectDirectory.dir('build-voxy-scan-20261011')
        afterEvaluate {
            sourceSets.featureHandoff.java.include 'dev/xantha/vss/testutil/**'
            tasks.named('jar', Jar).configure {
                destinationDirectory = layout.projectDirectory.dir('lib/voxy-scan-merge-20261011')
            }
            tasks.register('voxyScanTest', Test) {
                dependsOn tasks.named('featureHandoffClasses')
                testClassesDirs = sourceSets.featureHandoff.output.classesDirs
                classpath = sourceSets.featureHandoff.runtimeClasspath
                useJUnitPlatform(); maxHeapSize = '2G'
                reports.junitXml.outputLocation = layout.buildDirectory.dir('test-results/voxy-scan')
                reports.html.outputLocation = layout.buildDirectory.dir('reports/tests/voxy-scan')
                ['ScanMesher2D', 'ScanMerge', 'QuadMerger', 'AffineMerge', 'RectangleEncoding', 'CrossEncoding',
                 'GpuEncoding', 'PassStorage', 'MeshCompression', 'MeshCodec', 'MeshMemory', 'OwnershipMemory',
                 'SubmissionCoverage', 'FeatureHandoff', 'UploadHandoff', 'VisibleHandoff', 'RegionalOwnership',
                 'VegetationRuns', 'SpatialOrder', 'DisplayGeometry', 'DisplayError', 'LodSeams'].each {
                    include "**/Prediction${it}Test.class"
                }
                include '**/VssLodModulesTest.class'
                testLogging { events 'passed', 'skipped', 'failed'; showStandardStreams = true }
            }
            tasks.register('voxyScanGpuTest', Test) {
                dependsOn tasks.named('featureHandoffClasses')
                testClassesDirs = sourceSets.featureHandoff.output.classesDirs
                classpath = sourceSets.featureHandoff.runtimeClasspath
                useJUnitPlatform(); forkEvery = 1; maxHeapSize = '2G'
                systemProperty 'vss.gpuTests', 'true'
                systemProperty 'vss.vegetationReferenceJar', providers.gradleProperty('vssVegetationReferenceJar')
                        .getOrElse(project.file("lib/vegetation-render-20261011/vss-${project.version}.jar").absolutePath)
                reports.junitXml.outputLocation = layout.buildDirectory.dir('test-results/voxy-scan-gpu')
                reports.html.outputLocation = layout.buildDirectory.dir('reports/tests/voxy-scan-gpu')
                ['ScanMerge', 'VegetationRender', 'FeatureHandoff', 'ProductionBatch', 'Compact', 'DisplayLod', 'CompressedUpload',
                 'SegmentedMesh', 'VoxyDepthConvention', 'VoxySurface', 'Occlusion'].each {
                    include "**/Prediction${it}GpuTest.class"
                }
                testLogging { events 'passed', 'skipped', 'failed'; showStandardStreams = true }
            }
        }
    }
}
